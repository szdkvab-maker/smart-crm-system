{% load static %}
<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartCRM</title><link rel="stylesheet" href="{% static 'css/app.css' %}"></head>
<body><header><a class="brand" href="{% url 'dashboard' %}">SmartCRM<span>Рабочее пространство</span></a>{% if user.is_authenticated %}<nav><a href="{% url 'dashboard' %}">Обзор</a><a href="{% url 'clients_list' %}">Клиенты</a><a href="{% url 'deals_list' %}">Сделки</a><a href="{% url 'tasks_list' %}">Задачи</a></nav><form action="{% url 'logout' %}" method="post">{% csrf_token %}<button class="secondary">Выйти · {{ user.username }}</button></form>{% endif %}</header><main>{% for message in messages %}<p role="status" class="notice">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</main><footer>SmartCRM · Учебный проект</footer></body></html>
