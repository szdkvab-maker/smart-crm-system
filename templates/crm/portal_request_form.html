{% extends 'base.html' %}
{% block content %}
<a class="back-link" href="{% url 'portal_dashboard' %}">← Мои заявки</a>
<div class="page-heading"><div><p class="eyebrow">КАБИНЕТ КЛИЕНТА</p><h1>{{ title }}<span class="accent">.</span></h1><p class="muted">Заявка появится в CRM после одобрения администратора.</p></div></div>
<section class="panel form-panel">
  <form method="post" class="record-form">
    {% csrf_token %}{{ form.non_field_errors }}
    <div class="form-grid">
      {% for field in form %}<div class="field {% if field.name == 'description' %}wide{% endif %}">{{ field.label_tag }}{{ field }}{{ field.errors }}</div>{% endfor %}
    </div>
    <div class="form-actions"><button type="submit">Отправить заявку</button><a class="button secondary" href="{% url 'portal_dashboard' %}">Отмена</a></div>
  </form>
</section>
{% endblock %}
